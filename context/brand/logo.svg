<!-- Logo do tvOS (mestre). Exportar PNG com fundo transparente: icon.png 80×80 e largeIcon.png 130×130 em app/assets/ (Chrome headless ou qualquer renderizador de SVG). Specs: webostv.developer.lge.com/develop/references/appinfo-json -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3037B8"/>
      <stop offset=".5" stop-color="#171A66"/>
      <stop offset="1" stop-color="#090A26"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="50%">
      <stop offset="0" stop-color="#9A7BFF" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#6A55FF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#6A55FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63F0FF"/>
      <stop offset=".52" stop-color="#9B7BFF"/>
      <stop offset="1" stop-color="#FF68B0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15174F"/>
      <stop offset="1" stop-color="#090A28"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7B8FF"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-40%" width="160%" height="190%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="clip"><rect width="512" height="512" rx="118"/></clipPath>
    <clipPath id="scr"><rect x="106" y="140" width="300" height="196" rx="40"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="246" r="250" fill="url(#halo)"/>
    <path d="M0 0 H512 V132 Q256 196 0 132 Z" fill="url(#sheen)"/>
    <!-- brilho colorido sob a tela -->
    <rect x="96" y="150" width="320" height="214" rx="52" fill="url(#rim)" opacity=".55" filter="url(#soft)"/>
    <!-- tela -->
    <rect x="92" y="128" width="328" height="224" rx="56" fill="url(#rim)"/>
    <rect x="106" y="142" width="300" height="196" rx="42" fill="url(#screen)"/>
    <g clip-path="url(#scr)"><path d="M120 360 L250 120 L330 120 L200 360 Z" fill="url(#band)"/></g>
    <!-- play -->
    <path d="M232 200 L232 280 Q232 289 240 284.5 L304 247 Q311 242 304 237 L240 195.5 Q232 191 232 200 Z" fill="url(#play)" stroke="url(#play)" stroke-width="22" stroke-linejoin="round"/>
    <!-- base da TV -->
    <rect x="188" y="380" width="136" height="20" rx="10" fill="url(#rim)"/>
    <rect x="1.5" y="1.5" width="509" height="509" rx="116.5" fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="3"/>
  </g>
</svg>
